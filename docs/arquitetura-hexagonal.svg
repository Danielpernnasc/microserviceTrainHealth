<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Arquitetura hexagonal do microserviceTrainHealth</title>
  <desc>Diagrama de camadas: API, Application, Domain e Infrastructure, mostrando o fluxo de dependências do Health Service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="60" y="40" width="560" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">API layer</text>
  <text x="340" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Controllers ←→ DTOs (Request/Response)</text>
  <text x="340" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">BioimpedanceController, ClinicalAnalysisController</text>

  <line x1="340" y1="140" x2="340" y2="170" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="170" width="560" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Application layer</text>
  <text x="340" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Services (use cases)</text>
  <text x="340" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">BioimpendanceService, ClinicalAnalysisService</text>

  <line x1="340" y1="270" x2="340" y2="300" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="300" width="560" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="328" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Domain layer</text>
  <text x="340" y="348" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Models, enums e repositories</text>
  <text x="340" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">AthleteSnapshot, Bioimpedance, ClinicalAnalysis</text>
  <text x="340" y="388" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">ActivityLevel, AnalysisStatus, ConsultationStatus</text>

  <line x1="340" y1="420" x2="340" y2="450" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="450" width="560" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Infrastructure layer</text>
  <text x="340" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">MongoDB, OpenFeign, JWT, Security</text>
  <text x="340" y="518" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">AthleteClientService, JwtAuthFilter, SecurityConfig</text>
  <text x="340" y="538" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">RestTemplateConfig, SwaggerConfig</text>
</svg>

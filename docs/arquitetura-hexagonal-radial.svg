<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Arquitetura hexagonal radial do Health Service</title>
  <desc>Domínio no centro, cercado por portas (interfaces) e adaptadores externos como MongoDB, Athlete Service e clientes HTTP.</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Hexagon outline -->
  <polygon points="340,60 540,170 540,390 340,500 140,390 140,170" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Domain (center) -->
  <rect x="220" y="230" width="240" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Domain</text>
  <text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Bioimpedance, ClinicalAnalysis</text>
  <text x="340" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">AthleteSnapshot, enums</text>
  <text x="340" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Regras de negócio puras</text>

  <!-- Ports (in) -->
  <rect x="240" y="100" width="200" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Ports (in)</text>
  <text x="340" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Interfaces de serviço</text>
  <text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">BioimpendanceService</text>
  <line x1="340" y1="170" x2="340" y2="228" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowT)"/>

  <!-- Ports (out) -->
  <rect x="240" y="390" width="200" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="414" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Ports (out)</text>
  <text x="340" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Repository interfaces</text>
  <text x="340" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">BioimpedanceRepository</text>
  <line x1="340" y1="332" x2="340" y2="388" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrowT)"/>

  <!-- HTTP adapter -->
  <rect x="240" y="20" width="200" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">HTTP adapter</text>
  <text x="340" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Controllers, DTOs</text>
  <line x1="340" y1="80" x2="340" y2="98" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- MongoDB adapter -->
  <rect x="240" y="560" width="200" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="582" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">MongoDB adapter</text>
  <text x="340" y="600" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Spring Data MongoDB</text>
  <line x1="340" y1="460" x2="340" y2="558" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <!-- Feign adapter -->
  <rect x="20" y="285" width="180" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="110" y="309" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Feign adapter</text>
  <text x="110" y="329" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">AthleteClient</text>
  <text x="110" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Athlete Service</text>
  <line x1="200" y1="320" x2="240" y2="280" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- JWT adapter -->
  <rect x="480" y="285" width="180" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="570" y="309" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">JWT adapter</text>
  <text x="570" y="329" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">JwtAuthFilter</text>
  <text x="570" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">SecurityConfig</text>
  <line x1="480" y1="310" x2="460" y2="290" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrowC)"/>
</svg>
